# Nothing watched these pins, so every action drifted a major or three behind and CI
# started warning that the node20 runtime was deprecated. Monthly and grouped: one PR
# to review rather than ten, and slow enough that it never competes with real work.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # setup-gradle stays on the MIT v5 line on purpose: v6 moved caching into
      # gradle-actions-caching, a proprietary component whose use means accepting
      # gradle.com's Terms of Use. Without this, a monthly PR would quietly undo that
      # call. Revisit deliberately, not by merging a green bot PR.
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
