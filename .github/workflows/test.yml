name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      # Deliberately v5, not v6. v6 moved the caching layer into gradle-actions-caching,
      # a proprietary component whose use means accepting gradle.com's Terms of Use. v5 is
      # the last MIT release and already runs on Node 24, which is all this pin needs to do.
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # updateScreenshots rebuilds every image the README links to: scripts/render_device_frames.py
      # draws the macOS/browser window frames for media/screen_mac_*.png and media/screen_web_*.png,
      # and updateEnUsStoreScreenshots refreshes fastlane/metadata/android/en-US/images/. It also
      # runs updateNewLocaleStoreScreenshots, which fills in the supply folder of a locale that has
      # no store images yet, so a freshly added language does not need the manual full-matrix run
      # before its Play listing can go up. Refreshing the other 45 locales' existing images stays a
      # manual ':screenshotTests:generateStoreScreenshots' before a store release.
      - run: pip install pillow
      - run: ./gradlew spotlessApply
      - run: ./gradlew :screenshotTests:updateScreenshots
      - name: Auto-commit if changed
        if: github.event_name == 'push'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-fix: spotlessApply and updateScreenshots [skip ci]"
          git push
      # Runs after the auto-commit so the images it just laid out count. What is left is the part
      # no task can generate: a language with no supply folder, no listing copy, or copy that Play
      # would reject. Catching that here is what keeps a shipped language from sitting on an
      # English store page until someone notices.
      - run: ./gradlew checkStoreListings

  # Android Lint plus the Slack compose-lint-checks rules. This gates the build: `abortOnError` is
  # on in both modules, so any Compose issue that lint.xml does not explicitly allow fails here.
  #
  # Deliberately `lint` and not `lintFix`. The quick-fixes are not safe to apply unattended - they
  # rewrite receivers and rename functions without touching call sites, which leaves the tree not
  # compiling, and the auto-commit step above would push that.
  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # Both Android flavors: src/foss and src/playStore each hold sources the other does not.
      - run: ./gradlew :composeApp:lint :androidApp:lintFossDebug :androidApp:lintPlayStoreDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            composeApp/build/reports/lint-results-*.html
            androidApp/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # `bundle install` otherwise runs for the first time inside the release workflow, so a Gemfile.lock
  # that needs a newer Ruby than CI pins fails after the signed AAB is built and half the release
  # artifacts are published. `bundle update fastlane` runs against whatever Ruby the dev machine has,
  # which is how such a lock gets committed in the first place. Resolving it here, on the same
  # .ruby-version the release uses, turns that into a failed push instead of a broken release.
  fastlane-bundle:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # Proves the lock resolves and fastlane actually loads on this Ruby, not just that it installs.
      - run: bundle exec fastlane --version
